<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="ksd-sync-title ksd-sync-desc" class="ksd">
  <title id="ksd-sync-title">Machine sync data flow</title>
  <desc id="ksd-sync-desc">printer.cfg on the printer host is read through Moonraker's printer.objects.query (configfile settings). The resulting machine limits constrain the per-feature planning, which writes SET_VELOCITY_LIMIT commands into the G-code that is uploaded through Moonraker.</desc>
  <style>
    .ksd-canvas{fill:var(--ksd-canvas,#0b0e11)}
    .ksd-box{fill:var(--ksd-box,#0f1317);stroke:var(--ksd-line,#5c6b77);stroke-width:1}
    .ksd-box-accent{fill:var(--ksd-accent-fill,#0f2433);stroke:var(--ksd-accent,#4db9ff);stroke-width:1.5}
    .ksd-t{font-family:Inter,"IBM Plex Sans","Segoe UI",system-ui,sans-serif;fill:var(--ksd-ink,#d8e0e6)}
    .ksd-h{font-size:16px;font-weight:600;letter-spacing:.04em}
    .ksd-s{font-size:13px}
    .ksd-m{font-family:"IBM Plex Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
    .ksd-mut{fill:var(--ksd-muted,#8b99a4)}
    .ksd-acc{fill:var(--ksd-accent,#4db9ff)}
    .ksd-flow{stroke:var(--ksd-accent,#4db9ff);stroke-width:2;fill:none}
    .ksd-arrowhead{fill:var(--ksd-accent,#4db9ff)}
  </style>
  <defs>
    <marker id="ksd-sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ksd-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="ksd-canvas" x="0" y="0" width="720" height="640"/>
  <!-- 1 printer.cfg -->
  <rect class="ksd-box" x="20" y="20" width="680" height="80" rx="2"/>
  <text class="ksd-t ksd-h" x="40" y="52">printer.cfg</text>
  <text class="ksd-t ksd-s ksd-mut" x="40" y="76">on the printer host</text>
  <text class="ksd-t ksd-m" x="250" y="52">[printer] · [input_shaper]</text>
  <text class="ksd-t ksd-s ksd-mut" x="250" y="76">including values written by SAVE_CONFIG</text>
  <!-- 2 Moonraker -->
  <rect class="ksd-box" x="20" y="134" width="680" height="80" rx="2"/>
  <text class="ksd-t ksd-h" x="40" y="166">Moonraker</text>
  <text class="ksd-t ksd-s ksd-mut" x="40" y="190">read-only query</text>
  <text class="ksd-t ksd-m" x="250" y="166">GET /printer/objects/query?configfile=settings</text>
  <text class="ksd-t ksd-s ksd-mut" x="250" y="190">values as of the last Klipper start or restart</text>
  <!-- 3 Machine limits -->
  <rect class="ksd-box" x="20" y="248" width="680" height="80" rx="2"/>
  <text class="ksd-t ksd-h" x="40" y="280">Machine limits</text>
  <text class="ksd-t ksd-s ksd-mut" x="40" y="304">configured values</text>
  <text class="ksd-t ksd-m" x="250" y="280">max_velocity · max_accel</text>
  <text class="ksd-t ksd-m" x="250" y="300">square_corner_velocity · minimum_cruise_ratio</text>
  <text class="ksd-t ksd-m" x="250" y="320">shaper_type · shaper_freq_x · shaper_freq_y</text>
  <!-- 4 Planning -->
  <rect class="ksd-box-accent" x="20" y="362" width="680" height="80" rx="2"/>
  <text class="ksd-t ksd-h" x="40" y="394">Planning</text>
  <text class="ksd-t ksd-s ksd-mut" x="40" y="418">per feature</text>
  <text class="ksd-t ksd-s" x="250" y="394">outer wall · inner wall · infill · top/bottom · travel</text>
  <text class="ksd-t ksd-m ksd-acc" x="250" y="418">accel ≤ max_accel · speed ≤ max_velocity</text>
  <!-- 5 G-code -->
  <rect class="ksd-box" x="20" y="476" width="680" height="80" rx="2"/>
  <text class="ksd-t ksd-h" x="40" y="508">G-code</text>
  <text class="ksd-t ksd-s ksd-mut" x="40" y="532">uploaded via Moonraker</text>
  <text class="ksd-t ksd-m" x="250" y="508">SET_VELOCITY_LIMIT ACCEL=…</text>
  <text class="ksd-t ksd-m" x="250" y="532">SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=…</text>
  <!-- arrows -->
  <line class="ksd-flow" x1="120" y1="102" x2="120" y2="130" marker-end="url(#ksd-sync-arrow)"/>
  <line class="ksd-flow" x1="120" y1="216" x2="120" y2="244" marker-end="url(#ksd-sync-arrow)"/>
  <line class="ksd-flow" x1="120" y1="330" x2="120" y2="358" marker-end="url(#ksd-sync-arrow)"/>
  <line class="ksd-flow" x1="120" y1="444" x2="120" y2="472" marker-end="url(#ksd-sync-arrow)"/>
  <!-- note -->
  <text class="ksd-t ksd-s" x="20" y="588">Klipper applies SET_VELOCITY_LIMIT and M204 values even above the printer.cfg values</text>
  <text class="ksd-t ksd-s" x="20" y="608">(Klipper config changes, 2021-04-30).</text>
  <text class="ksd-t ksd-s ksd-mut" x="20" y="630">The limit check therefore has to happen in the slicer, before the G-code is written.</text>
</svg>
